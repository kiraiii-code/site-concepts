<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пристань — логотип проката лодок</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
:root{--river:#0f3b47;--sand:#e8b15a;--foam:#f3efe6;--ink:#0b2a33}
body{font-family:Onest,system-ui,sans-serif;background:#d8d3c8;color:var(--ink);display:flex;justify-content:center;padding:32px 16px}
.sheet{width:1600px;height:1200px;flex:none;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:16px;padding:16px;background:#d8d3c8}
@media (max-width:1640px){.sheet{zoom:.5}}
@media (max-width:840px){.sheet{zoom:.22}}
.p{border-radius:28px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.p small{position:absolute;left:28px;bottom:22px;font-size:20px;opacity:.55}
.a{background:var(--foam)}
.b{background:var(--river);color:var(--foam)}
.c{background:var(--sand)}
.d{background:#fff;gap:56px;align-items:end;padding-bottom:170px}
.lock{display:flex;align-items:center;gap:30px}
.word{font-weight:800;font-size:112px;letter-spacing:-.045em;line-height:1}
.tag{font-size:26px;font-weight:500;opacity:.7;margin-top:8px}
.stack{text-align:center}
.stack .word{font-size:84px;margin-top:22px}
.icon{display:grid;justify-items:center;gap:14px;font-size:18px;color:#5a6a6e}
.app{border-radius:22%;background:var(--river);display:grid;place-items:center}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 100 100">
    <rect x="16" y="22" width="68" height="11" rx="3"/>
    <rect x="25" y="33" width="11" height="34" rx="2"/>
    <rect x="64" y="33" width="11" height="34" rx="2"/>
    <path d="M8 76q7-7 14 0t14 0t14 0t14 0t14 0t14 0M15 89q7-7 14 0t14 0t14 0t14 0t14 0" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
  </symbol>
</svg>
<div class="sheet">
  <div class="p a">
    <div class="lock">
      <svg width="190" height="190" style="color:var(--river);fill:var(--river)"><use href="#mark"/></svg>
      <div><div class="word">Пристань</div><div class="tag">прокат лодок и сапов на Волге</div></div>
    </div>
    <small>Основная версия</small>
  </div>
  <div class="p b">
    <div class="stack">
      <svg width="220" height="220" style="color:var(--sand);fill:var(--foam)"><use href="#mark"/></svg>
      <div class="word">Пристань</div>
    </div>
    <small>На тёмном фоне</small>
  </div>
  <div class="p c">
    <svg width="380" height="380" style="color:var(--ink);fill:var(--ink)"><use href="#mark"/></svg>
    <small>Знак отдельно: причал из буквы П над волной</small>
  </div>
  <div class="p d">
    <div class="icon"><div class="app" style="width:180px;height:180px"><svg width="130" height="130" style="color:var(--sand);fill:var(--foam)"><use href="#mark"/></svg></div>180 px</div>
    <div class="icon"><div class="app" style="width:96px;height:96px"><svg width="70" height="70" style="color:var(--sand);fill:var(--foam)"><use href="#mark"/></svg></div>96 px</div>
    <div class="icon"><div class="app" style="width:48px;height:48px"><svg width="36" height="36" style="color:var(--sand);fill:var(--foam)"><use href="#mark"/></svg></div>48 px</div>
    <div class="icon"><svg width="24" height="24" style="color:var(--river);fill:var(--river)"><use href="#mark"/></svg>24 px</div>
    <small>Иконка приложения и фавикон</small>
  </div>
</div>
</body>
</html>
